name: 'API: CI'

on:
  push:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/api-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Formatting (Prettier)
        run: npm run prettier

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test Suite (Unit & Integration)
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.runCommand({serverStatus:1})' || mongosh --eval 'db.runCommand({serverStatus:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      CLIENT_URL: http://localhost:5173
      MONGODB_URL: mongodb://localhost:27017/projects-hub
      JWT_SECRET: ci-jwt-secret-key-32-chars-long-test-environment
      JWT_ACCESS_EXPIRATION_MINUTES: 30
      JWT_REFRESH_EXPIRATION_DAYS: 30
      JWT_RESET_PASSWORD_EXPIRATION_MINUTES: 10
      JWT_VERIFY_EMAIL_EXPIRATION_MINUTES: 10
      OTP_EXPIRATION_MINUTES: 10
      SMTP_HOST: smtp.ethereal.email
      SMTP_PORT: 587
      SMTP_USERNAME: ci-test-user
      SMTP_PASSWORD: ci-test-password
      EMAIL_FROM: "Projects Hub <noreply@projectshub.local>"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Test Suite
        run: npm test

      - name: Upload Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-report
          path: apps/api/coverage
          if-no-files-found: ignore

  docker-build:
    name: Docker Container Build Check
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build API Docker Image
        run: docker build -t projects-hub-api:ci apps/api
